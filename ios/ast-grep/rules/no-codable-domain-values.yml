id: no-codable-domain-values
language: swift
severity: error
message: Domain values carry no serialization. Add a plain Codable struct for the format where it is read and written (Storage or BudgetClient) and map it to the value.
files:
  - OpenPersonalFinanceKit/Sources/Domain/**
rule:
  kind: type_identifier
  regex: "^(Codable|Encodable|Decodable)$"
  inside:
    kind: inheritance_specifier
    stopBy: end
