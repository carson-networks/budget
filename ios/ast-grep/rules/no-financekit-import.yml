id: no-financekit-import
language: swift
severity: error
message: FinanceKit may only be imported in FinanceKitSource, its tests and OpenPersonalFinanceDelivery.swift.
ignores:
  - OpenPersonalFinanceKit/Sources/FinanceKitSource/**
  - OpenPersonalFinanceKit/Tests/FinanceKitSourceTests/**
  - OpenPersonalFinanceDelivery/OpenPersonalFinanceDelivery.swift
  - "**/.build/**"
rule:
  kind: import_declaration
  has:
    kind: identifier
    regex: "^FinanceKit(UI)?(\\.|$)"
