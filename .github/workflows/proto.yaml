name: Proto codegen

on:
  push:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # pnpm version comes from package.json#packageManager (pnpm 12)
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      # Bootstrap Node for the runner; project Node comes from
      # package.json#devEngines.runtime via pnpm install.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: buf generate
        run: pnpm generate

      - name: Check working tree
        run: git diff --exit-code src/connectRPC
